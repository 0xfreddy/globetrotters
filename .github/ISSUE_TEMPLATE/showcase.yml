name: Submit your site
description: Opt in to the Globetrotters showcase
title: "[Showcase]: "
body:
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Public website URL
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What did you build?
      description: Tell us how you use Globetrotters. Optionally attach a screenshot.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Showcase permission
      options:
        - label: I maintain this site and agree to its name, URL, and preview appearing in the public showcase.
          required: true
